<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Project Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#f3f4f6;padding:20px}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#d1d5db;border:1px solid #d1d5db}.visual{background:#fff}.header{background:#63a9e8;color:#111827;padding:14px 16px;font-size:16px}.chart-container{height:500px;padding:10px}canvas{width:100%!important;height:100%!important}@media(max-width:900px){.dashboard{grid-template-columns:1fr}}</style></head><body><div class="dashboard"><div class="visual"><div class="header">Delivery Assurance % by Target End Month</div><div class="chart-container"><canvas id="deliveryChart"></canvas></div></div><div class="visual"><div class="header">Project Cost Health (Forecasted Margin)</div><div class="chart-container"><canvas id="marginChart"></canvas></div></div></div><script>new Chart(document.getElementById('deliveryChart'),{type:'line',data:{labels:['Apr 2026','Aug 2026','Sep 2026','Aug 2027'],datasets:[{data:[100,11,12,50],borderColor:'#1a84ff',borderWidth:3,tension:.45,fill:false,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});new Chart(document.getElementById('marginChart'),{type:'line',data:{labels:['Mar 2026','Apr 2026','May 2026','Jun 2026','Jul 2026','Aug 2026','Sep 2026','Oct 2026','Nov 2026','Dec 2026','Jan 2027','Feb 2027','Apr 2027','May 2027','Aug 2027','Jul 2028'],datasets:[{data:[37,15,22,21,22,26,19,26,22,24,22,26,21,27,32,24],borderColor:'#1a84ff',borderWidth:3,tension:.45,fill:false,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});</script></body></html>
